services:
  cliftin:
    build:
      context: .
    environment:
      LIFTIN_DB_PATH: /liftin/BelloDataModel.sqlite
      TZ: America/Chicago
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    read_only: true
    restart: unless-stopped
    volumes:
      - "/Users/louie/Library/Containers/com.nstrm.Bello/Data/Library/Application Support/Liftin:/liftin:ro"
