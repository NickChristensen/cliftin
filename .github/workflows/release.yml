name: Release candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run openapi:check
      - name: Require a matching package version for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "${TAG_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Build the release-candidate container image
        run: docker build --tag cliftin-release-candidate:${{ github.sha }} .
